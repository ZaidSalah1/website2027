
name: Deploy Portfolio to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          SSH_HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/portfolio
          chmod 600 ~/.ssh/portfolio

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Hetzner
        run: |
          ssh -i ~/.ssh/portfolio \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            root@46.62.141.74
